<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EB">
<meta name="color-scheme" content="light">
<meta name="description" content="올림픽공원에 가기 전에 날씨·주차·코스를 한눈에 보고, 지도에서 오늘 걸을 길을 고르는 웹 앱">
<title>올림픽공원 산책 레이더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231E5B43'/%3E%3Cpath d='M23 9c0 8-6 14-14 14 0-8 6-14 14-14Z' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M9 23c2.4-5 5.8-8.4 10-10.4' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ── 상단 바 ───────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="brandmark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 5c0 8-5.5 14-14 14 0-8 6-14 14-14Z"/><path d="M5 19c2.5-5 6-8.5 10.5-10.5"/>
        </svg>
      </span>
      <span class="topbar__title">올림픽공원<span class="topbar__sub">산책 레이더</span></span>
    </div>
    <button class="iconbtn" id="btn-info" type="button" aria-label="데이터와 계산 방법">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.6"/><path d="M12 11.2V16M12 8.1h.01"/>
      </svg>
    </button>
  </header>

  <main class="views" id="views">

    <!-- ══ 탭 1 레이더 ═════════════════════════════════════ -->
    <section class="view view--radar is-on" id="view-radar" aria-label="레이더">

      <div class="hero" id="hero" data-mode="clear">
        <div class="hero__sky" aria-hidden="true"></div>

                                <svg class="hero__scene" viewBox="0 0 360 440" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
          <defs>
            <radialGradient id="gSun">
              <stop offset="0" stop-color="#FFF8D6" stop-opacity=".95"/>
              <stop offset=".4" stop-color="#FFE8A4" stop-opacity=".42"/>
              <stop offset="1" stop-color="#FFDE8A" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#A6C88B"/>
              <stop offset="1" stop-color="#74995F"/>
            </linearGradient>
            <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FFFDF6" stop-opacity="0"/>
              <stop offset="1" stop-color="#FFFDF6" stop-opacity=".5"/>
            </linearGradient>
            <linearGradient id="gScrim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FFFDF4" stop-opacity="0"/>
              <stop offset=".42" stop-color="#FFFDF4" stop-opacity=".5"/>
              <stop offset="1" stop-color="#FFFDF4" stop-opacity=".86"/>
            </linearGradient>
          </defs>

          <!-- 해 -->
          <g class="sun" transform="translate(86 136)">
            <circle r="62" fill="url(#gSun)"/>
            <circle class="sun__core" r="19" fill="#FFEA9F"/>
          </g>

          <!-- 구름 -->
          <g class="cloud cloud--1" fill="#FFFFFF" opacity=".72">
            <ellipse cx="0" cy="0" rx="28" ry="11"/><ellipse cx="20" cy="3" rx="20" ry="9"/><ellipse cx="-18" cy="4" rx="16" ry="7"/>
          </g>
          <g class="cloud cloud--2" fill="#FFFFFF" opacity=".5">
            <ellipse cx="0" cy="0" rx="21" ry="8"/><ellipse cx="17" cy="3" rx="14" ry="6"/><ellipse cx="-14" cy="3" rx="12" ry="5"/>
          </g>

          <!-- 새 -->
          <g class="birds" stroke="#6E7F68" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".5">
            <path d="M170 104c2.6-3 5.2-3 7.8 0"/><path d="M184 113c2-2.4 4-2.4 6 0"/>
          </g>

          <!-- 먼 능선 -->
          <path class="hill hill--far" d="M-20 302 L38 274 L92 294 L146 264 L200 290 L256 266 L312 290 L380 270 L380 440 L-20 440 Z" fill="#CDDEBC"/>
          <rect x="0" y="282" width="360" height="42" fill="url(#gHaze)"/>

          <!-- 중간 능선 -->
          <path class="hill hill--mid" d="M-20 334 C38 316 88 324 134 338 C180 352 212 326 258 328 C304 330 338 344 380 334 L380 440 L-20 440 Z" fill="var(--hill-mid)"/>

          <!-- 능선 위 작은 나무들 -->
          <g class="treeline" fill="#5F8A5C">
            <g transform="translate(16 336)"><rect x="-1.6" y="-2" width="3.2" height="12" fill="#6B543A"/><circle cx="0" cy="-11" r="9"/></g>
            <g transform="translate(45 333)"><rect x="-1.6" y="-2" width="3.2" height="13" fill="#6B543A"/><circle cx="0" cy="-13" r="10"/></g>
            <g transform="translate(76 338)"><rect x="-1.4" y="-2" width="2.8" height="11" fill="#6B543A"/><circle cx="0" cy="-10" r="8"/></g>
            <g transform="translate(112 330)"><rect x="-1.8" y="-2" width="3.6" height="15" fill="#6B543A"/><circle cx="0" cy="-15" r="11.5"/></g>
            <g transform="translate(146 336)"><rect x="-1.5" y="-2" width="3" height="12" fill="#6B543A"/><circle cx="0" cy="-11" r="9"/></g>
            <g transform="translate(178 331)"><rect x="-1.7" y="-2" width="3.4" height="14" fill="#6B543A"/><circle cx="0" cy="-14" r="11"/></g>
            <g transform="translate(206 338)"><rect x="-1.4" y="-2" width="2.8" height="11" fill="#6B543A"/><circle cx="0" cy="-10" r="8"/></g>
          </g>

          <!-- 작은 나무들 (오른쪽 능선) -->
          <g transform="translate(238 328)">
            <g class="tree tree--back">
              <rect x="-2.5" y="-3" width="5" height="20" rx="2.5" fill="#71553A"/>
              <circle cx="0" cy="-16" r="16" fill="#6B9663"/>
            </g>
          </g>




          <!-- 앞 잔디와 산책길 -->
          <path d="M-20 384 C48 364 118 374 184 386 C248 398 314 376 380 366 L380 440 L-20 440 Z" fill="url(#gGround)"/>

          <g transform="translate(228 368)">
            <g class="tree tree--right">
              <rect x="-4" y="-6" width="8" height="42" rx="4" fill="#76573B"/>
              <ellipse cx="4" cy="36" rx="24" ry="5" fill="#3F5C38" opacity=".18"/>
              <circle cx="-14" cy="-22" r="18" fill="#416D46"/>
              <circle cx="4" cy="-34" r="23" fill="#4C7C4C"/>
              <circle cx="20" cy="-18" r="16" fill="#5A8C52"/>
            </g>
          </g>
          <g transform="translate(340 392)">
            <g class="tree tree--near">
              <rect x="-3.5" y="-6" width="7" height="46" rx="3.5" fill="#6B4F35"/>
              <circle cx="-12" cy="-16" r="16" fill="#3B6442"/>
              <circle cx="4" cy="-28" r="21" fill="#487749"/>
            </g>
          </g>

          <path class="trail" d="M150 440 C196 416 232 404 268 396 C300 389 328 380 352 366"
                fill="none" stroke="#EFE3C6" stroke-width="10" stroke-linecap="round" opacity=".9"/>
          <g class="grass" stroke="#4F7A47" stroke-width="1.9" stroke-linecap="round" opacity=".55">
            <path d="M30 430c2-7 5-11 5-11"/><path d="M42 434c3-6 6-9 6-9"/><path d="M56 428c1-7 3-11 3-11"/>
            <path d="M206 424c2-7 4-10 4-10"/><path d="M218 430c3-6 6-9 6-9"/>
          </g>

          <!-- 비 -->
          <g class="rain" stroke="#BCD6E3" stroke-width="1.7" stroke-linecap="round">
            <line x1="24" y1="-40" x2="24" y2="-14" style="--d:0s;--x:0px"/>
            <line x1="62" y1="-40" x2="62" y2="-14" style="--d:.35s;--x:-2px"/>
            <line x1="98" y1="-40" x2="98" y2="-14" style="--d:.7s;--x:1px"/>
            <line x1="132" y1="-40" x2="132" y2="-14" style="--d:.15s;--x:2px"/>
            <line x1="168" y1="-40" x2="168" y2="-14" style="--d:.55s;--x:-1px"/>
            <line x1="204" y1="-40" x2="204" y2="-14" style="--d:.9s;--x:1px"/>
            <line x1="238" y1="-40" x2="238" y2="-14" style="--d:.25s;--x:-2px"/>
            <line x1="272" y1="-40" x2="272" y2="-14" style="--d:.65s;--x:2px"/>
            <line x1="306" y1="-40" x2="306" y2="-14" style="--d:.05s;--x:0px"/>
            <line x1="340" y1="-40" x2="340" y2="-14" style="--d:.45s;--x:-1px"/>
            <line x1="44" y1="-40" x2="44" y2="-14" style="--d:.8s;--x:1px"/>
            <line x1="116" y1="-40" x2="116" y2="-14" style="--d:.2s;--x:-2px"/>
            <line x1="186" y1="-40" x2="186" y2="-14" style="--d:.6s;--x:2px"/>
            <line x1="256" y1="-40" x2="256" y2="-14" style="--d:1s;--x:0px"/>
            <line x1="322" y1="-40" x2="322" y2="-14" style="--d:.3s;--x:1px"/>
          </g>



          <!-- 아래쪽 글자 자리 -->
          <rect x="0" y="300" width="360" height="140" fill="url(#gScrim)" pointer-events="none"/>

          <!-- 실내 전환: 박물관 (오른쪽) -->
          <g transform="translate(292 306) scale(.72)"><g class="indoor">
            <ellipse cx="0" cy="10" rx="92" ry="34" fill="#FFE7B4" opacity=".45"/>
            <rect x="-68" y="-26" width="138" height="52" rx="4" fill="#FBF3E2"/>
            <rect x="-78" y="-34" width="158" height="8" rx="3.5" fill="#DCCDAE"/>
            <g fill="#FFD68B">
              <rect x="-52" y="-14" width="14" height="30" rx="2"/>
              <rect x="-32" y="-14" width="14" height="30" rx="2"/>
              <rect x="-12" y="-14" width="14" height="30" rx="2"/>
              <rect x="8" y="-14" width="14" height="30" rx="2"/>
              <rect x="28" y="-14" width="14" height="30" rx="2"/>
              <rect x="48" y="-14" width="14" height="30" rx="2"/>
            </g>
          </g></g>
        </svg>

        <div class="demo" id="demo" role="group" aria-label="시연 모드">
          <button class="demo__btn is-on" type="button" data-demo="clear">맑음·여유</button>
          <button class="demo__btn" type="button" data-demo="busy">주말·혼잡</button>
          <button class="demo__btn" type="button" data-demo="rain">비·실내전환</button>
        </div>

        <div class="gauge" id="gauge">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="gauge__track" cx="50" cy="50" r="42"/>
            <circle class="gauge__bar" id="gauge-bar" cx="50" cy="50" r="42"/>
          </svg>
          <div class="gauge__num">
            <b id="gauge-score">—</b>
            <small>산책 지수</small>
          </div>
        </div>

        <div class="hero__text">
          <p class="hero__eyebrow" id="hero-eyebrow">11월 16일 월요일 · 19:40</p>
          <h1 class="hero__title" id="hero-title">오늘 산책 지수</h1>
          <p class="hero__sub" id="hero-sub">날씨를 읽는 중</p>
        </div>
      </div>

      <div class="pick" id="pick"></div>

      <p class="fineprint" id="fineprint">
        기상청 단기예보(샘플) · 한국체육산업개발 실데이터 · 지도 © OpenStreetMap
      </p>
    </section>

    <!-- ══ 탭 2 지도 ══════════════════════════════════════ -->
    <section class="view view--map" id="view-map" aria-label="지도">
      <div class="mapwrap" id="mapwrap">
        <div class="map" id="map"></div>
        <div class="map__fallback" id="map-fallback" hidden aria-hidden="true"></div>

        <div class="chips" id="course-chips" role="group" aria-label="코스 고르기"></div>

        <div class="legend" id="legend">
          <span><i class="dot dot--free"></i>원활</span>
          <span><i class="dot dot--mid"></i>혼잡</span>
          <span><i class="dot dot--busy"></i>만차</span>
          <span><i class="dot dot--na"></i>자료 없음</span>
        </div>

        <button class="map__recenter" id="map-recenter" type="button" aria-label="공원 전체 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2"/><path d="M12 3v3.4M12 17.6V21M3 12h3.4M17.6 12H21"/>
          </svg>
        </button>

        <span class="map__badge" id="map-badge" hidden>오프라인 지도</span>
      </div>

      <div class="mapcard" id="mapcard"></div>
    </section>

    <!-- ══ 탭 3 도감 ══════════════════════════════════════ -->
    <section class="view view--spots" id="view-spots" aria-label="도감">
      <header class="pagehead">
        <h1 class="pagehead__h">공원 도감</h1>
        <p class="pagehead__sub">오늘 걸을 길에 있는 네 곳</p>
      </header>
      <div class="grid" id="spot-grid"></div>
      <div id="name-finder"></div>
      <p class="fineprint">일러스트는 스팟을 직접 그린 것이고, 위치·해설은 공공데이터를 옮겼습니다.</p>
    </section>

    <!-- ══ 탭 4 안내 ══════════════════════════════════════ -->
    <section class="view view--guide" id="view-guide" aria-label="안내">
      <header class="pagehead">
        <h1 class="pagehead__h">현장 안내</h1>
        <div class="nowbar" id="nowbar"></div>
      </header>
      <div class="segmented" id="guide-seg" role="tablist" aria-label="안내 분류">
        <button class="segmented__item is-on" type="button" role="tab" data-guide="event" aria-selected="true">공연</button>
        <button class="segmented__item" type="button" role="tab" data-guide="lawn" aria-selected="false">잔디·규정</button>
        <button class="segmented__item" type="button" role="tab" data-guide="faq" aria-selected="false">FAQ</button>
      </div>
      <div id="guide-body"></div>
    </section>

  </main>

  <!-- ── 탭 바 ─────────────────────────────────────────────── -->
  <nav class="tabbar" aria-label="화면 이동">
    <button class="tabbar__btn is-on" type="button" data-view="radar" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 12 19 7.6"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/>
        <path d="M12 4.6a7.4 7.4 0 1 0 7.2 5.8"/><path d="M12 8.2a3.8 3.8 0 1 0 3.6 2.9"/>
      </svg>
      <span>레이더</span>
    </button>
    <button class="tabbar__btn" type="button" data-view="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 4.5 3.8 6.8v12.7L9 17.2l6 2.3 5.2-2.3V4.5L15 6.8 9 4.5Z"/><path d="M9 4.5v12.7M15 6.8v12.7"/>
      </svg>
      <span>지도</span>
    </button>
    <button class="tabbar__btn" type="button" data-view="spots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5.6c3-1.2 5.3-1.2 8 0 2.7-1.2 5-1.2 8 0v12.8c-3-1.2-5.3-1.2-8 0-2.7-1.2-5-1.2-8 0Z"/>
        <path d="M12 5.9v12.2"/>
      </svg>
      <span>도감</span>
    </button>
    <button class="tabbar__btn" type="button" data-view="guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.4 4.2 19 7.1v5.8l-5.6 2.9v3.4H8.7v-3.4H6.2A2.2 2.2 0 0 1 4 13.6V8.9c0-1.2 1-2.2 2.2-2.2h4.5l2.7-2.5Z"/>
        <path d="M8.7 19.2v1.2"/>
      </svg>
      <span>안내</span>
    </button>
  </nav>
</div>

<!-- ── 바텀시트 ───────────────────────────────────────────── -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close="1"></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__grab" data-close="1" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheet-title">제목</h2>
      <button class="sheet__close" type="button" data-close="1" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<script src="api-config.js"></script>
<script src="data/data-bundle.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
<script>
  /* Leaflet CDN 이 막힌 환경(오프라인·심사장 네트워크 차단)에서는 자체 SVG 지도로 그린다 */
  if (!window.L) { document.documentElement.classList.add('no-leaflet'); }
</script>
</body>
</html>
